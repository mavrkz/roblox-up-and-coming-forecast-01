# Roblox Up-and-Coming forecast 01: forecast Roblox's Up-and-Coming chart place by place, its top 10 at every hour of the
# 72 hours after entries close. Validated by server/competitions/load.ts against contracts/competition.ts; seeded by
# `npm run db:seed`. tests/unit/comp-roblox-up-and-coming-forecast-01.test.ts holds the bundle, its rules' quotes and its
# grading end to end. The owner's ask of 2026-11-11: "another version of the roblox top charts one but instead it's for
# the up and coming chart section and it runs for 72h after it closes and is for $500 total - it can be open for 48h
# total as well": roblox-trending-forecast-01's twin on another chart, its format, scoring, gate, table and baseline
# design kept, its window three times as long. It follows the forecast-bundle template grader/forecast/ranked.ts states
# (.cosmos/rules/contest-design.mdc).
#
# The chart (read live on 2026-11-11T03:17Z and 03:30Z, collector/roblox/chart.ts): GET
# https://apis.roblox.com/explore-api/v1/get-sorts lists the explore page's sorts, Up-and-Coming among them (id
# Up_And_Coming_V6, sortId up-and-coming, gameSetTargetId 692, "Top experiences published within the last 28 days sorted
# by user growth."), and get-sort-content?sortId=up-and-coming&sessionId=<any> serves it: 97 games, no next page, no
# sponsored row, each with its universeId, rootPlaceId, name, playerCount, votes and genre. It is filtered as Top
# Trending is (a request naming no filter got device=computer,age=all,country=us and the same order; country=all served
# another, Build a Bridge #3), so every read names device=computer and country=us (chart.ts UP_AND_COMING). Six reads 2 s
# apart served one order, their player counts differing in 31 of the 97 games: the order is computed, the counts live,
# so one read is the chart. It moves faster than Top Trending: in the public archive's 45 reads its #1 changed 13 times
# among 10 games, and its 44 pairs of consecutive reads, 3.6 to 11.0 hours apart, changed its top 10 in 42 (a median of
# 6 places; Top Trending's 30 pairs changed in 27, a median of 5).
#
# Format: a program/v1 forecast on data recorded after the deadline, as roblox-trending-forecast-01's (harness.final_dataset:
# contracts/competition.ts, contracts/program-dataset.ts): its input is the chart's history up to the deadline, and its
# reference the scored window's reads (collector/roblox/freeze.ts, forecastSpecOf('up-and-coming', 72):
# UP_AND_COMING_ANSWER_SCHEMA), the 72 whole UTC hours after the deadline, each hour's read the first valid
# house-recorder read that started in it, at least 36 of the 72 read or no answer. It is frozen by `collector/roblox/cli.ts
# freeze --chart up-and-coming --window-hours 72` from the house recorder's snapshots (collector/roblox/record.ts,
# deploy/k8s/components/roblox-chart-up-and-coming, a second recorder beside the trending one, which freezes it too once
# the window ends into datasets/roblox-up-and-coming-forecast-01-final). The automation's lock step registers that freeze
# sealed and attaches it to the final phase itself once it lands (server/competitions/lifecycle/auto.ts
# frozenFinalStage: phases[final] names no dataset, so it looks under <slug>-final); `admin-dataset --sealed --attach
# roblox-up-and-coming-forecast-01:final` is the override. An Up-and-Coming read's line (chart.ts ChartSnapshot) holds
# the chart's rows under up_and_coming, the Top Trending chart of the same read under top_trending as context, then Top
# Playing Now and the up-and-coming games' details. The dev phase grades on this directory's own sealed practice instance
# (input/, reference/), built by `node collector/roblox/cli.ts practice --chart up-and-coming --window-hours 72 --archive
# competitions/roblox-up-and-coming-forecast-01/archive/roblox-snapshots.ndjson --history-until 2026-11-07T23:00:00Z
# --competition roblox-up-and-coming-forecast-01 --out <dir>` from archive/roblox-snapshots.ndjson: 45 reads of the
# chart, 2026-10-30T07:36:30Z to 2026-11-10T23:23:11Z, converted by `cli.ts archive --chart up-and-coming` from the
# public MIT-licensed archive https://github.com/Kenny-Dhub/roblox-snapshots (data/discover/latest.json at each of its
# commits, its explore:up-and-coming source; the trending archive's commit wherever two commits carried one read), its
# licence carried in input/NOTICE.txt. The practice history ends at 2026-11-07T23:00:00Z (34 reads, [💡UPD] Survive Your
# Ideas #1, South Hell [HORROR] #2) and its window is the 72 hours after it, to 2026-11-10T23:00:00Z, the latest a
# 72-hour window the archive's reads hold whole: 10 reads in it, Survive Your Ideas #1 in none (South Hell in 4, Sweep
# The Moon in 2, Do Not Stop. in the last 3, [🎩] Ragdoll Research in 1), the close's top 10 holding 9 of the window's
# first read's top 10 and 5 of its last. The archive reads every 3.6 to 11 hours, so the practice answer needs 1 slot
# read (its min_slots), the final's 36. The final's history is the archive's 45 reads and every recorder read before the
# deadline.
#
# Dates (the owner's, 2026-11-11): entries open 2026-11-11T06:00:00Z for 48 hours, to the deadline
# 2026-11-13T06:00:00Z; the scored window is the 72 hours after it, to 2026-11-16T06:00:00Z, and has no key of its own
