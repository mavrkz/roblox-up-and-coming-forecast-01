# The log score ranks (6 decimals, 4 shown), rounded to 3 significant figures in public rows (the catalogue rounds
# every paid rank column, tests/unit/catalogue.test.ts; the rules say so); the typical probability per place is
# exp(log score / 10); the top-10 hits and agreement are means over the reads, 1 decimal shown; the agreement breaks
# exact ties (tie_break_index); valid is the gate (harness.gate): an entry whose forecast does not read ranks below
# every one that does.
leaderboard:
  title: Results
  primary_index: 0
  tie_break_index: 3
  columns:
